# compose.yaml
# To be used with Docker Compose.
# For explanation of the config options, go to:
#     https://github.com/SinTan1729/chhoto-url/blob/main/docs/INSTALLATION.md
# The commented out configs are optional.

services:
  chhoto-url:
    image: sintan1729/chhoto-url:alpine
    # image: sintan1729/chhoto-url:alpine # for extra convenience
    # The images can also be pulled from ghcr.io
    restart: unless-stopped
    container_name: chhoto-url
    tty: true
    # mem_limit: "50m"
    # You may enable the next two options if you want. Make sure that you run the container as the proper
    # user. In most cases, user: 1000:1000 should work. You might also need to mount a directory with your
    # db and not just the file itself. Make sure to adjust CHHOTO_DB_URL accordingly.
    # It does add extra security, but I don't know enough about docker to help in case it breaks something.
    # cap_drop:
    #   - ALL
    ports:
      - 4567:4567
    environment:
      - CHHOTO_DB_URL=/data/urls.sqlite
      - CHHOTO_SQLITE_USE_WAL_MODE=True
      # - CHHOTO_DISABLE_BACKUPS=False
      # - CHHOTO_SITE_URL=https://www.example.com
      # - CHHOTO_HASH_ALGORITHM=Argon2
      # - CHHOTO_LISTEN_PORT=4567
      # - CHHOTO_LISTEN_ADDRESS=0.0.0.0
      - CHHOTO_PASSWORD=TopSecretPass # Change it before you run the container
      - CHHOTO_EXIT_ON_NO_AUTH=True
      # - CHHOTO_OIDC_ISSUER_URL=https://sso.example.com
      # - CHHOTO_OIDC_CLIENT_ID=some-random-client-id
      # - CHHOTO_OIDC_CUSTOM_CLAIM=claim=value
      # - CHHOTO_OIDC_EXTRA_ORIGINS=https://example1.com,https://example2.com
      # - CHHOTO_API_KEY=SECURE_API_KEY
      - CHHOTO_REDIRECT_METHOD=TEMPORARY
      - CHHOTO_SLUG_STYLE=Pair
      # - CHHOTO_SLUG_LENGTH=8
      # - CHHOTO_TRY_LONGER_SLUG=False
      # - CHHOTO_ALLOW_CAPITAL_LETTERS=False
      # - CHHOTO_PUBLIC_MODE=Disable
      # - CHHOTO_PUBLIC_MODE_EXPIRY_DELAY=3600
      # - CHHOTO_DISABLE_FRONTEND=False
      # - CHHOTO_CUSTOM_SITE_TITLE=Custom Title
      # - CHHOTO_CUSTOM_LANDING_DIRECTORY=/custom/dir/location
      # - CHHOTO_CACHE_CONTROL_HEADER=no-cache, private
      # - CHHOTO_FRONTEND_PAGE_SIZE=10
      # - CHHOTO_SESSION_MASTER_KEY=SECURE_MASTER_KEY
      # - CHHOTO_EXTRA_PROTOCOLS=ftps,obsidian
      # - TZ=America, Chicago
    volumes:
      - data:/data
    # Disable this if using the scratch images.
    healthcheck:
      test: wget -qO- http://127.0.0.1:1729/healthz || exit 1
      interval: 60s
      start_period: 10s
      retries: 3
      timeout: 10s

volumes:
  db:
