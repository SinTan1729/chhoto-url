name: Test and Release

on:
  push:
    tags:
      - '*'
    branches: ['dev']
    paths: ['backend/**', 'frontend/**']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: chhoto-url

jobs:
  build:
    name: Build and Test - ${{ matrix.platform.os-name }}
    if: |
      github.ref_type == 'tag' ||
      !startsWith(github.event.head_commit.message, 'build: Bumped version to')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - os-name: Linux-x86_64
            target: x86_64-unknown-linux-musl
          - os-name: Linux-arm64
            target: aarch64-unknown-linux-musl
          - os-name: Linux-armv7
            target: armv7-unknown-linux-musleabihf
          - os-name: Linux-riscv64
            target: riscv64gc-unknown-linux-musl
            # Need to use an unreleased version for now.
            cross-version: a5c1c64f0810eb90c790e94b7904b27dccc02287

    steps:
      - uses: actions/checkout@v6

      - name: Compute short SHA
        id: vars
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build binary and test
        uses: houseabsolute/actions-rust-cross@v1
        env:
          CARGO_GIT_COMMIT: ${{ github.ref_type != 'tag' && steps.vars.outputs.short_sha || '' }}
        with:
          command: both
          target: ${{ matrix.platform.target }}
          args: --locked --release --manifest-path=backend/Cargo.toml
          cross-version: ${{ matrix.platform.cross-version }}
          rust-cache-parameters: '{"workspaces":"backend -> target"}'

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform.target }}
          path: ./backend/target/${{ matrix.platform.target }}/release/${{ env.IMAGE_NAME }}
          retention-days: 1
          if-no-files-found: error

  dev:
    name: Push dev image
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: write
      packages: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - name: Prepare build context
        uses: ./.github/actions/prepare-image-context
        with:
          fetch-depth: 1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/sintan1729/${{ env.IMAGE_NAME }}
          tags: type=raw,value=dev

      - uses: docker/setup-buildx-action@v4

      - name: Build and push dev image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          file: deploy/Containerfile.alpine
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/riscv64
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: sintan1729/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}

  release:
    name: Push release images
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: write
      packages: write
      attestations: write
    steps:
      - name: Prepare build context
        uses: ./.github/actions/prepare-image-context
        with:
          fetch-depth: 0
          create-empty-dir: 'true'

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Alpine image metadata
        id: meta-alpine
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            sintan1729/${{ env.IMAGE_NAME }}
            ghcr.io/sintan1729/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{major}}-alpine
            type=semver,pattern={{major}}.{{minor}}-alpine
            type=semver,pattern={{version}}-alpine
            type=raw,value=latest-alpine
            type=raw,value=alpine

      - name: Extract scratch image metadata
        id: meta-scratch
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            sintan1729/${{ env.IMAGE_NAME }}
            ghcr.io/sintan1729/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}}
            type=raw,value=latest
            type=raw,value=scratch

      - uses: docker/setup-buildx-action@v4

      - name: Build and push Alpine image
        id: push-alpine
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          file: deploy/Containerfile.alpine
          tags: |
            ${{ steps.meta-alpine.outputs.tags }}
            ghcr.io/sintan1729/${{ env.IMAGE_NAME }}:dev
          labels: ${{ steps.meta-alpine.outputs.labels }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/riscv64
          annotations: ${{ steps.meta-alpine.outputs.annotations }}

      - name: Build and push scratch image
        id: push-scratch
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          file: deploy/Containerfile.scratch
          tags: ${{ steps.meta-scratch.outputs.tags }}
          labels: ${{ steps.meta-scratch.outputs.labels }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/riscv64
          annotations: ${{ steps.meta-scratch.outputs.annotations }}

      - name: Attest Alpine image
        uses: actions/attest@v4
        with:
          subject-name: sintan1729/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push-alpine.outputs.digest }}

      - name: Attest scratch image
        uses: actions/attest@v4
        with:
          subject-name: sintan1729/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push-scratch.outputs.digest }}

      - name: Generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --latest --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}
          OUTPUT: CHANGELOG.md

      - name: Show changelog
        run: cat CHANGELOG.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.git-cliff.outputs.changelog }}
          make_latest: true
