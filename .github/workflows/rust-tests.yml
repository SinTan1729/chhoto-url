name: Run Tests

on:
  push:
    branches:
      - dev
    paths:
      - 'backend/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache Dependencies
        uses: actions/cache@v5
        with:
          path: |
            target
            .cargo
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Build
        run: cargo build
      - name: Run tests
        run: cargo test
