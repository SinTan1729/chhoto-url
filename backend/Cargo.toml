[package]
name = "chhoto-url"
version = "7.11.7"
edition = "2024"
rust-version = "1.96"
description = "A simple self-hosted URL shortener with no unnecessary features."
documentation = "https://github.com/SinTan1729/chhoto-url"
readme = "../README.md"
homepage = "https://chhoto.link"
repository = "https://github.com/SinTan1729/chhoto-url"
license = "MIT"
keywords = [
  "actix-web",
  "chhoto-url",
  "container",
  "docker",
  "link-shortener",
  "podman",
  "quadlet",
  "rust",
  "self-hosted",
  "shortener",
  "url-shortener",
  "webapp",
]
categories = ["web-programming"]

[dependencies]
actix-files = "0.7.5"
actix-web = { version = "4.20.0", features = ["secure-cookies"] }
argon2 = "0.6.0"
base64-url = "4.0.1"
constant_time_eq = "0.6.1"
env_filter = "2.0.0"
jiff = "1.0.1"
log = "0.4.35"
nanorand = "0.8.0"
openidconnect = "4.1.0"
r2d2 = "0.8.10"
regex = "1.13.2"
rusqlite = { version = "0.43.0", features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros"] }
url = "2.5.8"

[dev-dependencies]
actix-http = "3.22.0"
actix-service = "2.0.3"
regex = "1.13.2"
tempfile = "3.27.0"

[lints.cargo]
unused_dependencies = "deny"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
strip = "symbols"
lto = "fat"
panic = "abort"
codegen-units = 1
