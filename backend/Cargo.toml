[package]
name = "chhoto-url"
version = "7.10.2"
edition = "2024"
authors = ["Sayantan Santra <mail@sayantansantra.com>"]
license = "mit"
description = "A simple selfhosted URL shortener with no unnecessary features."
homepage = "https://github.com/SinTan1729/chhoto-url"
documentation = "https://github.com/SinTan1729/chhoto-url"
repository = "https://github.com/SinTan1729/chhoto-url"
readme = "README.md"
keywords = [
    "docker",
    "podman",
    "container",
    "quadlet",
    "rust",
    "chhoto-url",
    "self-hosted",
    "url-shortener",
    "webapp",
    "shortener",
    "link-shortener",
    "actix-web",
]
categories = ["web-programming"]
rust-version = "1.96"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
actix-web = { version = "4.18.1", features = [ "secure-cookies" ] }
actix-files = "0.7.2"
rusqlite = { version = "0.41.1", features = [ "backup", "bundled" ] }
regex = "1.13.1"
rand = "0.10.3"
nanoid = "0.5.0"
serde = { version = "1.0.229", features = [ "derive", "rc" ] }
serde_json = "1.0.154"
argon2 = "0.6.0"
chrono = "0.4.45"
tokio = { version = "1.54.1", features = [ "macros" ] }
log = "0.4.34"
url = "2.5.8"
subtle = "2.6.1"
openidconnect = "4.0.1"
env_filter = "2.0.0"
base64-url = "4.0.1"
time = { version = "0.3.55", features = [ "formatting", "macros" ] }

[dev-dependencies]
actix-http = "3.20.0"
actix-service = "2.0.3"
regex = "1.13.1"
tempfile = "3.27.0"
